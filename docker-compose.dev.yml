# =============================================================
# Docker Compose — mode développement
# Usage : docker compose -f docker-compose.dev.yml up
# =============================================================

services:
  # ---- PostgreSQL ----
  db:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bibliometrie}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env (aucun défaut)}
      DB_OWNER_USER: ${DB_OWNER_USER:-postgres}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?à définir dans .env (aucun défaut)}
    volumes:
      - pgdata:/var/lib/postgresql
    # Publication sur la boucle locale : la base de développement n'a pas à être joignable
    # depuis le réseau, où son mot de passe de superutilisateur serait exposé.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 5

  # ---- Backend FastAPI (hot reload) ----
  backend:
    build:
      context: .
      dockerfile: interfaces/api/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/app
    # Publication sur la boucle locale, comme la base : le serveur de développement sert des
    # docs d'API ouvertes et un cookie de session sans l'attribut `Secure`, réglages qui
    # supposent qu'il ne quitte pas la machine. Ouvrir à une autre machine — un téléphone sur
    # le même réseau, par exemple — demande de nommer l'interface qui la dessert.
    ports:
      - "127.0.0.1:8000:8000"
    # Le fichier d'environnement entier, à la différence de la composition de production : ce
    # conteneur sert l'API, mais porte aussi l'outillage de test et de vérification, qui se
    # connecte sous le propriétaire du schéma.
    env_file: .env
    environment:
      # Override pour le réseau docker : le conteneur db est accessible via l'hôte "db"
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  # ---- Frontend SvelteKit (vite dev server) ----
  frontend:
    build:
      context: ./interfaces/frontend
    restart: unless-stopped
    working_dir: /app
    # Le conteneur tourne en root et écrirait ses dossiers générés sur le disque
    # hôte en root (via le bind mount). Les volumes anonymes ci-dessous gardent
    # ces dossiers (dépendances installées, sorties de build) à l'intérieur du
    # conteneur, pour ne pas semer de fichiers root dans l'arbre de travail.
    volumes:
      - ./interfaces/frontend:/app
      - /app/node_modules
      - /app/.svelte-kit
      - /app/build
    # Boucle locale, comme le backend qu'il proxifie.
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
