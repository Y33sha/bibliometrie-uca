# =============================================================
# Docker Compose — mode production
# Usage : docker compose -f docker-compose.prod.yml up -d
# =============================================================
# Le backend sert l'API + le frontend buildé (SPA).
# Pas de conteneur frontend séparé.

services:
  # ---- PostgreSQL ----
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bibliometrie}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env (aucun défaut)}
    volumes:
      - pgdata:/var/lib/postgresql
    # Pas de port exposé en prod (accès interne uniquement)

    # Interdit à un processus du conteneur d'acquérir des privilèges par un binaire setuid.
    # Les capacités du noyau, elles, restent en place : l'entrypoint de l'image démarre en
    # root pour ajuster le répertoire de données avant de basculer sur l'utilisateur postgres.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 5

  # ---- Application (backend + frontend buildé) ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Préfixe de déploiement (vide = racine). Définir ROOT_PATH dans .env
      # pour servir sous un sous-chemin derrière un reverse-proxy. La valeur
      # doit être identique au build (frontend) et au runtime (uvicorn).
      args:
        ROOT_PATH: ${ROOT_PATH:-}
    restart: unless-stopped
    # Publication sur la loopback : seul un reverse-proxy tournant sur la même machine
    # atteint l'application. Un proxy hébergé ailleurs demande d'ouvrir l'interface qui le
    # dessert, en la nommant — non de retirer l'adresse, ce qui publierait le port sur toutes.
    ports:
      - "127.0.0.1:8003:8000"
    env_file: .env
    environment:
      DB_HOST: db
      ROOT_PATH: ${ROOT_PATH:-}
    security_opt:
      - no-new-privileges:true
    # L'API tourne sous un utilisateur non privilégié et écoute au-dessus du port 1024 :
    # aucune capacité du noyau ne lui est nécessaire.
    cap_drop:
      - ALL
    # Racine en lecture seule, et aucun emplacement en écriture : du code qui parviendrait à
    # s'exécuter ne laisse rien derrière lui. Les logs partent sur la sortie standard, et le
    # pipeline s'exécute avec `--no-raw-store`, donc sans archiver les réponses des sources.
    read_only: true
    tmpfs:
      - /tmp
    # Plafonds de ressources : bornent au conteneur l'effet d'une requête coûteuse, d'une
    # boucle emballée ou d'un afflux d'appels, plutôt que de le laisser atteindre la machine
    # hôte. Valeurs de départ, à relever si une exécution du pipeline s'y heurte.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      # Route servie sans accès à la base : distingue « application vivante » de « base
      # injoignable », que la condition de démarrage ci-dessous couvre déjà. Le chemin est
      # celui du routage interne, indépendant du préfixe de déploiement.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/pipeline/phases", timeout=5)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
