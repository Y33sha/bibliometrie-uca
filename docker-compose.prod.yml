# =============================================================
# Docker Compose — mode production
# Usage : docker compose -f docker-compose.prod.yml up -d
# =============================================================
# Le backend sert l'API + le frontend buildé (SPA).
# Pas de conteneur frontend séparé.

services:
  # ---- PostgreSQL ----
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bibliometrie}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env (aucun défaut)}
    volumes:
      - pgdata:/var/lib/postgresql
    # Pas de port exposé en prod (accès interne uniquement)

    # Exécution directe sous l'utilisateur `postgres` de l'image : le point d'entrée ne passe
    # pas par root pour ajuster le répertoire de données. Le volume nommé hérite du
    # propriétaire que l'image donne à `/var/lib/postgresql` ; un montage lié, lui, demanderait
    # que l'hôte l'ajuste d'abord.
    user: postgres
    security_opt:
      - no-new-privileges:true
    # Aucune capacité du noyau : sans la bascule d'identité du point d'entrée, la base n'en
    # exerce aucune.
    cap_drop:
      - ALL
    # Racine en lecture seule. La base écrit dans son volume de données ; le répertoire
    # temporaire et le répertoire de sockets vivent en mémoire.
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    # Plafonds de ressources : bornent au conteneur l'effet d'une requête coûteuse ou d'un
    # afflux de connexions. Valeurs de départ, à relever si une exécution du pipeline s'y
    # heurte.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 5

  # ---- Application (backend + frontend buildé) ----
  #
  # Seul composant exposé au réseau, et le seul dont l'environnement soit énuméré : il ne
  # reçoit que ce qu'il lit. Ni le mot de passe du propriétaire du schéma, ni les identifiants
  # d'accès aux sources n'y figurent — l'API se connecte sous le rôle restreint et n'émet
  # aucune requête sortante. Le service `pipeline` ci-dessous porte l'un et les autres.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Préfixe de déploiement (vide = racine). Définir ROOT_PATH dans .env
      # pour servir sous un sous-chemin derrière un reverse-proxy. La valeur
      # doit être identique au build (frontend) et au runtime (uvicorn).
      args:
        ROOT_PATH: ${ROOT_PATH:-}
    # Image nommée : le service `pipeline` la reprend telle quelle, sans reconstruire.
    image: bibliometrie-uca:latest
    restart: unless-stopped
    # Publication sur la loopback : seul un reverse-proxy tournant sur la même machine
    # atteint l'application. Un proxy hébergé ailleurs demande d'ouvrir l'interface qui le
    # dessert, en la nommant — non de retirer l'adresse, ce qui publierait le port sur toutes.
    ports:
      - "127.0.0.1:8003:8000"
    # Pas d'`env_file` : l'environnement est énuméré, si bien qu'une variable ajoutée au
    # fichier d'environnement n'atterrit pas ici sans qu'on l'ait voulu.
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-bibliometrie}
      DB_APP_USER: ${DB_APP_USER:?rôle restreint requis (cf. infrastructure/db/roles.sql)}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
      DB_SSLMODE: ${DB_SSLMODE:-}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-30}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_HASH: ${ADMIN_HASH:?empreinte bcrypt requise (aucune connexion sans elle)}
      SESSION_SECRET: ${SESSION_SECRET:?clé de signature des sessions requise}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ROOT_PATH: ${ROOT_PATH:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Adresses depuis lesquelles les en-têtes de proxy font foi, lues par uvicorn.
      #
      # Le défaut vaut la passerelle du réseau déclaré en bas de fichier : le port est publié
      # sur la boucle locale de l'hôte, mais une connexion qui l'emprunte entre dans le
      # conteneur avec l'adresse de cette passerelle, non `127.0.0.1`. Une valeur qui ne la
      # couvre pas fait écarter l'en-tête, et le limiteur compte tous les clients dans un même
      # seau — dix échecs de connexion interdisent alors l'administration à tout le monde.
      #
      # Un reverse-proxy joignant l'application autrement (autre machine, conteneur voisin sur
      # un réseau distinct) demande de renseigner son adresse à la place.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.30.0.1}
    security_opt:
      - no-new-privileges:true
    # L'API tourne sous un utilisateur non privilégié et écoute au-dessus du port 1024 :
    # aucune capacité du noyau ne lui est nécessaire.
    cap_drop:
      - ALL
    # Racine en lecture seule : du code qui parviendrait à s'exécuter ne laisse rien derrière
    # lui. Les logs partent sur la sortie standard, seul `/tmp` est monté en mémoire.
    read_only: true
    tmpfs:
      - /tmp
    # Plafonds de ressources : bornent au conteneur l'effet d'une requête coûteuse, d'une
    # boucle emballée ou d'un afflux d'appels, plutôt que de le laisser atteindre la machine
    # hôte.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      # Route servie sans accès à la base : distingue « application vivante » de « base
      # injoignable », que la condition de démarrage ci-dessous couvre déjà. Le chemin est
      # celui du routage interne, indépendant du préfixe de déploiement.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/pipeline/phases", timeout=5)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  # ---- Pipeline (collecte et traitement) ----
  #
  # Même image que l'application, environnement distinct. Lui seul porte le mot de passe du
  # propriétaire du schéma — il modifie la structure, rafraîchit les vues matérialisées et vide
  # des tables — et les identifiants d'accès aux sources, qu'il est seul à interroger. C'est ce
  # qui donne sa portée au rôle restreint de l'API : le conteneur exposé au réseau ne porte
  # aucun des deux, et qui en obtiendrait l'exécution de code n'y trouverait rien à reprendre.
  #
  # Hors du cycle web, comme le pipeline lui-même : `profiles` le tient à l'écart de `up`, et
  # il s'exécute à la demande ou par tâche planifiée.
  #
  #   docker compose -f docker-compose.prod.yml --profile pipeline run --rm pipeline
  #
  # Arguments de l'orchestrateur passés après le nom du service ; sans rien, le run complet
  # défini par `command` ci-dessous.
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROOT_PATH: ${ROOT_PATH:-}
    image: bibliometrie-uca:latest
    profiles:
      - pipeline
    # `--no-raw-store` : sans archivage des réponses des sources, le conteneur n'a besoin
    # d'aucun emplacement en écriture. Rejouer la normalisation demande alors de réinterroger
    # les sources.
    command: ["python", "run_pipeline.py", "--no-raw-store"]
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-bibliometrie}
      DB_OWNER_USER: ${DB_OWNER_USER:?propriétaire du schéma requis}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_SSLMODE: ${DB_SSLMODE:-}
      # Identifiants d'accès aux sources : une source non configurée est sautée au lancement,
      # avec un avertissement, sans interrompre le run.
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      WOS_API_KEY: ${WOS_API_KEY:-}
      SCANR_USERNAME: ${SCANR_USERNAME:-}
      SCANR_PASSWORD: ${SCANR_PASSWORD:-}
      POLITE_POOL_EMAIL: ${POLITE_POOL_EMAIL:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Un run est plus gourmand qu'une requête : c'est ce plafond-ci qu'une exécution qui s'y
    # heurte demande de relever.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    depends_on:
      db:
        condition: service_healthy


# Réseau du déploiement, à sous-réseau fixe : l'adresse de sa passerelle est ce que voient les
# conteneurs comme pair d'une connexion venue de l'hôte, et `FORWARDED_ALLOW_IPS` la nomme.
# Un sous-réseau déjà pris sur la machine hôte demande d'en choisir un autre, ici et là-bas.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
