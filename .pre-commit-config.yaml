# Deux étages, installés par `pre-commit install` (une fois par machine) :
#   - pre-commit : lint, format, types, hygiène des fichiers, concordance du contrat OpenAPI ;
#   - pre-push : les contrôles de la CI qui se passent d'une base de données.
# Les hooks vérifient sans modifier. Lancement manuel : `pre-commit run --all-files`, et `--hook-stage pre-push` pour le second étage.

# Sans cette clé, `pre-commit install` pose seulement l'étage pre-commit.
default_install_hook_types: [pre-commit, pre-push]

# Un hook sans `stages` tourne seulement au commit.
default_stages: [pre-commit]

repos:
  # Outils lancés par `uv run python -m`, dans le venv du projet, à la version de `uv.lock`. Le contrôle d'application de Windows bloque les exécutables non signés qu'uv ou pre-commit posent dans un venv (« os error 4551 ») ; l'interpréteur est signé. `import-linter`, sans point d'entrée module, se lance par sa fonction de console.
  #
  # pyrefly et lint-imports analysent tout le projet, fichiers non suivis compris : pyrefly tourne au commit et se rejoue au push ; lint-imports tourne au push seulement.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint)
        entry: uv run python -m ruff check --no-fix --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format --check (format)
        entry: uv run python -m ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: check-yaml
        name: check-yaml
        entry: uv run python -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: check-toml
        entry: uv run python -m pre_commit_hooks.check_toml
        language: system
        types: [toml]

      - id: check-merge-conflict
        name: check-merge-conflict
        entry: uv run python -m pre_commit_hooks.check_merge_conflict
        language: system
        types: [text]

      - id: check-added-large-files
        name: check-added-large-files
        entry: uv run python -m pre_commit_hooks.check_added_large_files
        args: [--maxkb=500]
        language: system

      # Correction : `uv lock`.
      - id: uv-lock
        name: uv-lock (vérifie que le lockfile est à jour)
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      # schema.ts suit le contrat OpenAPI de l'API, qui dépend de tout le code Python. Correction : `npm run types:gen` dans interfaces/frontend.
      - id: openapi-types
        name: openapi-typescript (concordance des types et du contrat)
        entry: |-
          bash -c 'json=$(mktemp) && ts=$(mktemp) && uv run python -m interfaces.cli.dev.dump_openapi "$json" && ( cd interfaces/frontend && npx openapi-typescript "$json" -o "$ts" >/dev/null ) && if diff -q interfaces/frontend/src/lib/api/schema.ts "$ts" >/dev/null; then rm -f "$json" "$ts"; else rm -f "$json" "$ts"; echo schema.ts a dérivé de OpenAPI, régénérer via npm run types:gen puis commiter; exit 1; fi'
        language: system
        pass_filenames: false
        files: (\.py|^interfaces/frontend/src/lib/api/schema\.ts)$

      # Rejoué au push : rattrape un commit en --no-verify.
      - id: pyrefly
        name: pyrefly (types)
        entry: uv run python -m pyrefly check --summary=none
        language: system
        pass_filenames: false
        files: (\.py|^pyproject\.toml)$
        stages: [pre-commit, pre-push]

      # ---- Étage pre-push : contrôles de la CI sans base de données, sur tout le projet ----

      - id: ci-deptry
        name: deptry (hygiène des dépendances)
        entry: uv run python -m deptry .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ci-pip-audit
        name: pip-audit (vulnérabilités)
        entry: uv run python -m pip_audit --skip-editable
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Rejoués au push : rattrapent un commit en --no-verify.
      - id: ci-ruff-check
        name: ruff check (lint)
        entry: uv run python -m ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ci-ruff-format
        name: ruff format --check (format)
        entry: uv run python -m ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ci-lint-imports
        name: lint-imports (architecture DDD)
        entry: uv run python -c "from importlinter.cli import lint_imports_command; lint_imports_command()"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ci-pytest-unit
        name: pytest (tests unitaires)
        entry: uv run python -m pytest tests/unit/ -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Confronte `.python-version` et `interfaces/frontend/.nvmrc` au Dockerfile, et le Node du terminal aux contrôles du frontend.
      - id: ci-versions-de-langage
        name: versions de langage alignées sur les images
        entry: ./scripts/verifier-les-versions.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # `--omit=dev` : seul `dependencies` part dans le bundle servi au navigateur. Seuil `moderate` : CVSS y classe les XSS.
      - id: ci-frontend-audit
        name: npm audit (vulnérabilités du bundle)
        entry: bash -c 'cd interfaces/frontend && npm audit --omit=dev --audit-level=moderate'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ci-frontend-check
        name: svelte-check (types frontend)
        entry: bash -c 'cd interfaces/frontend && npm run check'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ci-frontend-lint
        name: eslint (frontend)
        entry: bash -c 'cd interfaces/frontend && npm run lint'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ci-frontend-test
        name: vitest (tests frontend)
        entry: bash -c 'cd interfaces/frontend && npm test'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
