[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliometrie-uca"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx2==2.16.0",            # client HTTP unique du projet
    "psycopg[binary]==3.3.6",    # driver PostgreSQL de SQLAlchemy
    "sqlalchemy==2.1.6",         # query builder Core
    "alembic==1.20.1",           # migrations DB
    "fastapi==0.159.1",
    "starlette==1.9.0",          # importé directement (Response, Scope, RequestResponseEndpoint)
    "anyio==4.15.1",             # importé directement : taille du threadpool posée au démarrage de l'API
    "uvicorn==0.54.0",           # serveur ASGI ; lancé en ligne de commande, jamais importé
    "bcrypt==5.0.0",
    "python-dotenv==1.2.4",      # requis par pydantic-settings pour env_file ; jamais importé
    "pydantic==2.14.1",          # requis par pydantic-settings et utilisé directement
    "pydantic-settings==2.16.1",
    "pyahocorasick==2.3.1",      # automate Aho-Corasick : matching multi-formes des adresses (phase affiliations)
    "defusedxml==0.7.1",         # lecture du TEI des enregistrements HAL, sans développer les entités XML
    "orjson>=3.13.0",
    "xxhash>=4.0.2",
    "scipy==1.18.1",             # affectation optimale (algorithme hongrois) des contributions sources aux contributions
]

[project.scripts]
# Orchestrateur du pipeline, installé comme commande : `run_pipeline --mode daily`.
run_pipeline = "pipeline.run:main"
# Migrations de la base par défaut et de chaque instance de `instances/`.
migrate_all = "interfaces.cli.dev.migrate_all:main"

# Outils de développement et de test. `uv sync` les installe par défaut ; `--no-dev` les écarte.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",   # tests des moissonnages HTTP async du pipeline
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "pyrefly==1.4.0",
    "deptry==0.25.1",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0", # check-yaml/toml/… lancés en local via `python -m`
    "import-linter==2.15",
    "pyyaml==6.0.3",           # lecture des descriptions de déploiement par les tests
    "tqdm==4.70.1",            # barres de progression du pipeline, importées sous `try` (cf. pipeline/runtime/observability/progression.py)
    "splink==5.0.0",           # record linkage probabiliste (Fellegi-Sunter) : estimation des poids du modèle de l'alignement des auteurs
    "duckdb==2.0.0",           # moteur de Splink, et lecture des fichiers Parquet de l'estimation des poids
    "pyarrow==26.0.0",         # écriture des fichiers Parquet de l'estimation des poids
    "zensical==0.0.73",            # site de la documentation, construit depuis docs/ et zensical.toml
    "mkdocstrings-python==2.0.10", # référence du code dans le site, générée depuis les docstrings
    "playwright==1.58.0",          # captures d'écran du guide utilisateur (interfaces/cli/dev/screenshots.py)
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["application*", "domain*", "infrastructure*", "interfaces*", "pipeline*"]

# deptry : dépendances manquantes, inutilisées ou transitives.
[tool.deptry]
known_first_party = ["application", "domain", "infrastructure", "interfaces", "pipeline"]
# Code non distribué, dont les imports relèvent des dépendances de développement : outillage du dépôt (`scripts/`, `.claude/`), répertoire de travail local (`data/`), scripts de développement qui importent Splink, DuckDB, pyarrow ou Playwright.
extend_exclude = [
    "frontend",
    ".venv",
    "venv",
    "scripts",
    ".claude",
    "data",
    "interfaces/cli/dev/estimate_residual_weights.py",
    "interfaces/cli/dev/screenshots.py",
]

# import-linter : règles de dépendance entre couches. Lancement : `lint-imports`.
[tool.importlinter]
root_packages = ["domain", "application", "infrastructure", "interfaces", "pipeline"]
# Nécessaire aux contrats qui ciblent des modules externes.
include_external_packages = true
# Type de contrat maison, défini dans `scripts/contrats_import.py`.
contract_types = ["purete_du_noyau: scripts.contrats_import.PureteDuNoyau"]

[[tool.importlinter.contracts]]
name = "Couches DDD (layered)"
type = "layers"
layers = ["interfaces", "infrastructure | application", "domain"]
# `application` atteint `infrastructure` par ses ports. `infrastructure` importe de `application.ports` les dataclasses qui typent ses signatures.
ignore_imports = [
    "infrastructure.** -> application.ports.**",
]

[[tool.importlinter.contracts]]
name = "Pipeline : hors des couches hexagonales"
type = "forbidden"
source_modules = ["pipeline"]
forbidden_modules = ["application", "interfaces"]
# Le pipeline importe `domain` et les modules techniques d'`infrastructure` (connexion, réglages, journalisation, fragments SQL). Le chemin indirect par les ports d'`application`, qu'`infrastructure` importe, est admis.
ignore_imports = ["infrastructure.** -> application.ports.**"]

[[tool.importlinter.contracts]]
name = "Pipeline : importé par interfaces seulement"
type = "forbidden"
source_modules = ["domain", "application", "infrastructure"]
forbidden_modules = ["pipeline"]
# L'API et les scripts en ligne de commande (`interfaces/`) sont les seuls clients du pipeline.

[[tool.importlinter.contracts]]
name = "Pipeline : le noyau d'exécution ignore les phases"
type = "forbidden"
source_modules = ["pipeline.runtime", "pipeline.graph", "pipeline.task_runner", "pipeline.http"]
forbidden_modules = ["pipeline.ingestion", "pipeline.transformation"]
# Les phases dépendent du noyau (`runtime`, `graph`, `task_runner`) et de l'outillage HTTP (`http`). Seul l'orchestrateur `pipeline/run.py` assemble les phases.

[[tool.importlinter.contracts]]
name = "Sources : les orchestrateurs de phase les importent, jamais l'inverse"
type = "forbidden"
source_modules = [
    "pipeline.ingestion.crossref",
    "pipeline.ingestion.datacite",
    "pipeline.ingestion.hal",
    "pipeline.ingestion.openalex",
    "pipeline.ingestion.scanr",
    "pipeline.ingestion.theses",
    "pipeline.ingestion.wos",
]
forbidden_modules = [
    "pipeline.ingestion.common.harvest",
    "pipeline.ingestion.common.harvest_by_person",
    "pipeline.ingestion.common.fetch_missing",
    "pipeline.ingestion.common.fetch_stale",
    "pipeline.ingestion.common.normalize",
]
# Une source implémente les contrats de `normalizer`, `doi_search` et `stale_refetch` ; l'orchestrateur la câble dans sa phase.

[[tool.importlinter.contracts]]
name = "Routers : pas d'import direct de infrastructure"
type = "forbidden"
source_modules = ["interfaces.api.routers"]
forbidden_modules = ["infrastructure"]
# Les routers reçoivent leurs dépendances par `Depends(...)`, fabriquées dans `interfaces.api.deps` (composition root) : le chemin indirect `routers → deps → infrastructure` est admis. Une écriture passe par un service d'`application`. Une lecture importe son adaptateur de `infrastructure.read_models`, pour typer la dépendance et lire les modèles de réponse.
allow_indirect_imports = "true"
ignore_imports = ["interfaces.api.routers.** -> infrastructure.read_models.**"]

[[tool.importlinter.contracts]]
name = "Composition root : repositories concrets uniquement dans deps"
type = "forbidden"
source_modules = ["interfaces.api"]
forbidden_modules = ["infrastructure.repositories"]
# Seul `interfaces/api/deps.py` instancie les repositories concrets. `pipeline.public` relève de son propre contrat.
ignore_imports = [
    "interfaces.api.deps -> infrastructure.repositories.**",
    "interfaces.api.** -> pipeline.public",
]

[[tool.importlinter.contracts]]
name = "API : le pipeline par son interface publique"
type = "forbidden"
source_modules = ["interfaces.api"]
forbidden_modules = ["pipeline"]
# L'API importe seulement `pipeline/public.py`, qui exporte l'ordre des phases et les recalculs ciblés.
ignore_imports = ["interfaces.api.** -> pipeline.public"]

[[tool.importlinter.contracts]]
name = "Adapters : la connexion se reçoit, elle ne s'ouvre pas"
type = "forbidden"
source_modules = ["infrastructure.read_models", "infrastructure.repositories"]
forbidden_modules = ["infrastructure.db.engine"]
# Un adapter reçoit la connexion de la requête, avec sa transaction et sa lecture seule. Une connexion tirée de l'engine échapperait à la lecture seule. Une lecture parallélisée reçoit une fabrique de connexions (`connection_factory`).

[[tool.importlinter.contracts]]
name = "API : aucune requête réseau sortante"
type = "forbidden"
source_modules = ["interfaces.api"]
forbidden_modules = [
    "httpx2",
    "httpx",
    "socket",
    "http",
    "requests",
    "aiohttp",
    "urllib3",
    "ftplib",
    "smtplib",
    "poplib",
    "imaplib",
    "telnetlib",
    "socketserver",
]
# L'API échange seulement avec PostgreSQL : le trafic sortant appartient au pipeline. Le contrat suit les chaînes d'imports, pas seulement les imports directs.
#
# `httpx` est l'autre nom de publication de `httpx2`. Les autres noms couvrent les primitives réseau et les clients de la bibliothèque standard, et les clients tiers. L'outil ne sait pas viser `urllib.request`, sous-module d'un paquet externe : la règle `banned-api` de ruff l'interdit.

[[tool.importlinter.contracts]]
name = "API : aucun lancement de programme"
type = "forbidden"
source_modules = ["interfaces.api"]
forbidden_modules = ["subprocess", "multiprocessing", "pty"]
# Le contrat suit les chaînes d'imports ; les règles `S6xx` de ruff voient seulement les appels écrits. `os.posix_spawn` reste hors de portée : interdire `os` écarterait tout le module.

[[tool.importlinter.contracts]]
name = "Domain : rien hors bibliothèque standard"
type = "purete_du_noyau"
paquet = "domain"
# `_typeshed` est fourni par les vérificateurs de types et n'existe pas à l'exécution.
autorises = ["_typeshed"]
# Les modèles d'entrée-sortie JSONB sont dans `infrastructure/jsonb_models/`.

[tool.deptry.per_rule_ignores]
# Dépendances de production qu'aucun module n'importe.
DEP002 = ["python-dotenv", "uvicorn"]
# Dépendances de développement qu'un module de production importe sous `try`.
DEP004 = ["tqdm"]

# Alias paquet distribué → nom de module importé (les noms peuvent différer).
[tool.deptry.package_module_name_map]
pydantic-settings = "pydantic_settings"
pyahocorasick = "ahocorasick"

[tool.ruff]
line-length = 100
extend-exclude = [
    "*.md",                      # extraits de code de la documentation
    ".claude",                   # hooks du harnais de développement, hors code applicatif
    "data",                      # répertoire de travail local, hors du dépôt
    "interfaces/frontend",
    "bibliometrie_uca.egg-info",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (undefined names, unused imports, etc.)
    "I",     # isort (ordre des imports)
    "UP",    # pyupgrade (syntaxe obsolète)
    "B",     # flake8-bugbear (pièges courants)
    "C901",  # complexité cyclomatique
    "ASYNC", # flake8-async : I/O bloquantes dans une async def, etc.
    "S",     # flake8-bandit : sécurité (exceptions dans per-file-ignores)
    "A",     # flake8-builtins : un nom qui masque une fonction de base
    "C4",    # flake8-comprehensions : compréhensions et appels de collection superflus
    "DTZ",   # flake8-datetimez : instants sans fuseau (cf. `domain.dates.today`)
    "G",     # flake8-logging-format : message de journalisation formaté à l'émission
    "ISC",   # flake8-implicit-str-concat : concaténation implicite de littéraux
    "LOG",   # flake8-logging : usage du module de journalisation
    "PERF",  # Perflint : boucles réécrivables en compréhension
    "PIE",   # flake8-pie : tournures inutiles
    "Q",     # flake8-quotes : cohérence des guillemets
    "RET",   # flake8-return : chemins de retour superflus
    "TID",   # flake8-tidy-imports : imports relatifs remontants
]
ignore = [
    "E501", # ligne trop longue : docstrings et commentaires tiennent sur une ligne par paragraphe
    "E402", # module-level import not at top
    "B008", # function call in default argument : `Depends()` de FastAPI
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# `httpx2` est le client HTTP unique du projet, encadré par des délais d'expiration, des tentatives bornées, un disjoncteur et une liste blanche d'hôtes.
"urllib.request".msg = "Le client HTTP du projet est httpx2, et le trafic sortant appartient au pipeline (pipeline/ingestion)."

# L'engine unique du projet choisit l'identité de connexion selon le processus et installe le suivi du DML. Exceptions dans `per-file-ignores`.
"sqlalchemy.create_engine".msg = "L'engine du projet se construit dans infrastructure/db/engine.py, et s'obtient par get_sync_engine."

# Le type JSONB de SQLAlchemy écrit `None` en JSON `null`, que les contraintes et les index sur NULL ignorent.
"sqlalchemy.dialects.postgresql.JSONB".msg = "Le type JSONB du projet est Jsonb, dans infrastructure/db/jsonb.py : il écrit None en NULL SQL."

[tool.ruff.lint.isort]
# Déclarées : l'inférence de ruff varie d'une version à l'autre.
known-first-party = ["application", "domain", "infrastructure", "interfaces", "pipeline"]
# Regroupe les imports d'un même module en un seul bloc, alias inclus.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# `S105`/`S106` : identifiants factices des fixtures. `S608` : SQL de jeu de données. `TID251` : engine de la base de test.
"tests/*" = ["E402", "S101", "S105", "S106", "S108", "S324", "S608", "TID251"]
# Constructeur de l'engine et type JSONB du projet.
"infrastructure/db/engine.py" = ["TID251"]
"infrastructure/db/jsonb.py" = ["TID251"]
# `S608` (SQL composé par interpolation) : ces modules composent leurs requêtes à partir de fragments écrits en dur ; les valeurs reçues passent par des paramètres liés.
"infrastructure/read_models/*" = ["S608"]
"pipeline/*" = ["S101", "S608"]
"infrastructure/repositories/*" = ["S608"]
"infrastructure/sql_fragments.py" = ["S608"]
"alembic/versions/*" = ["S608"]
# Scripts de développement : `dump_schema` lance `pg_dump`.
"interfaces/cli/dev/*" = ["S603", "S607"]
# Génération d'illustrations : la disposition d'un graphe tire au sort des positions.
"docs/img/graphs/*" = ["S311"]
# `S101` (assertion, effacée en mode optimisé) : ces couches s'en servent pour des invariants internes, sans décision d'autorisation.
"domain/*" = ["S101"]
"infrastructure/*" = ["S101"]
# Scripts en ligne de commande : imports tardifs, SQL composé à partir de fragments écrits en dur.
"interfaces/cli/*" = ["E402", "S608"]
"interfaces/api/routers/*" = ["E402"] # imports tardifs fréquents

[tool.pytest.ini_options]
testpaths = ["tests"]
# `importlib` : des fichiers de test homonymes coexistent dans des répertoires distincts, sans `__init__.py`.
addopts = "-q --import-mode=importlib"
# Les tests `async def` sont reconnus sans décorateur.
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["application", "domain", "infrastructure", "interfaces", "pipeline"]
omit = [
    "tests/*",
    "*/__init__.py",
    "interfaces/cli/oneshot/*", # scripts ponctuels, exécutés une fois et conservés comme trace
]

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Pyrefly : vérificateur de types. Lancement : `uv run pyrefly check`.
[tool.pyrefly]
# Interpréteur des images de production (cf. `scripts/versions-des-images.sh`).
python-version = "3.14.0"
# Système des images de production. Sans ce réglage, pyrefly lancé sous Windows rejette les appels POSIX (`signal.SIGKILL`).
python-platform = "linux"
project-excludes = [
    "**/frontend/",
    "**/bibliometrie_uca.egg-info/",
    "**/.venv/",
    "**/build/",
    # Répertoire de travail local : données brutes et scripts jetables, hors du dépôt.
    "**/data/",
    # Copie de travail de mutmut : double les paquets du projet.
    "**/mutants/",
]
# Bibliothèques tierces sans types, déclarées une à une : un joker masquerait aussi les imports cassés du projet.
ignore-missing-imports = ["ahocorasick"]

[tool.pyrefly.errors]
# `Any` explicite et génériques sans paramètre (`dict`, `list`) interdits ; exceptions dans les sous-configurations.
explicit-any = "error"
implicit-any-type-argument = "error"
no-any-return = "error"
# Toutes les fonctions sont annotées.
unannotated-parameter = "error"
unannotated-return = "error"

# `explicit-any` désactivé module par module. Les trois premiers servent du JSON de forme libre : l'alias récursif `JsonValue` produirait un type TypeScript circulaire dans `schema.ts`. `facets` appelle une facette par son nom (`getattr`).
[[tool.pyrefly.sub-config]]
matches = "infrastructure/read_models/config/models.py"
[tool.pyrefly.sub-config.errors]
explicit-any = false

[[tool.pyrefly.sub-config]]
matches = "infrastructure/read_models/pipeline_runs/models.py"
[tool.pyrefly.sub-config.errors]
explicit-any = false

[[tool.pyrefly.sub-config]]
matches = "interfaces/api/models/config.py"
[tool.pyrefly.sub-config.errors]
explicit-any = false

[[tool.pyrefly.sub-config]]
matches = "infrastructure/read_models/publications/facets.py"
[tool.pyrefly.sub-config.errors]
explicit-any = false

# Une ligne SQL alimente son type par dépaquetage de clés, invisible à l'analyse statique. Le module contrôle ces clés à l'exécution.
[[tool.pyrefly.sub-config]]
matches = "infrastructure/db/rows.py"
[tool.pyrefly.sub-config.errors]
bad-unpacking = false

# Tests et scripts ponctuels : seul le code cassé est vérifié (import, nom ou mot-clé inexistant).
[[tool.pyrefly.sub-config]]
matches = "tests/**"
[tool.pyrefly.sub-config.errors]
unannotated-return = false
implicit-any-parameter = false
implicit-any-type-argument = false
explicit-any = false
no-any-return-implicit = false
no-any-return-explicit = false
bad-index = false
bad-argument-type = false
missing-attribute = false
not-iterable = false
unsupported-operation = false
bad-return = false
bad-assignment = false
no-matching-overload = false
read-only = false

# Même règle pour les scripts ponctuels.
[[tool.pyrefly.sub-config]]
matches = "interfaces/cli/oneshot/**"
[tool.pyrefly.sub-config.errors]
unannotated-return = false
implicit-any-parameter = false
implicit-any-type-argument = false
explicit-any = false
no-any-return-implicit = false
no-any-return-explicit = false
bad-index = false
bad-argument-type = false
missing-attribute = false
not-iterable = false
unsupported-operation = false
bad-return = false
bad-assignment = false
no-matching-overload = false
read-only = false

# mutmut : tests de mutation du domaine. Lancement : `uv run --with mutmut mutmut run`, puis `mutmut results` et `mutmut show <mutant>`.
[tool.mutmut]
# Couche pure : les tests unitaires l'exercent sans base de données.
source_paths = ["domain"]
# Toute la suite unitaire : des règles du domaine sont testées sous la couche qui les appelle.
pytest_add_cli_args_test_selection = ["tests/unit"]
# Fichiers lus par les tests hors de la couche mutée, copiés dans `mutants/` : modules importés, fichiers relus par les tests de conformité.
also_copy = [
    "application",
    "infrastructure",
    "interfaces/api",
    "interfaces/cli",
    "interfaces/frontend/src/lib",
    "interfaces/frontend/Dockerfile",
    "scripts",
    ".github",
    "Dockerfile",
    "docker-compose.prod.yml",
    "docker-compose.yml",
    "pyproject.toml",
    "start.sh",
]

