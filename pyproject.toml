[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliometrie-uca"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",             # unique client HTTP : appels synchrones et asynchrones du pipeline
    "psycopg[binary]==3.3.4",     # driver Postgres pour SQLAlchemy ; import symbolique dans infrastructure/db/engine.py
    "sqlalchemy==2.0.52",        # query builder Core
    "alembic==1.19.1",           # migrations DB
    "fastapi==0.141.1",
    "starlette==1.6.0",          # importé directement (Response, Scope, RequestResponseEndpoint) ; ≥1.3.1 corrige CVE-2026-54282/54283 (≥1.0.1 corrigeait déjà CVE-2026-48710)
    "uvicorn==0.52.4",           # serveur ASGI ; lancé en ligne de commande, jamais importé
    "bcrypt==5.0.0",
    "python-dotenv==1.2.3",      # requis par pydantic-settings pour env_file ; CVE-2026-28684 fixed
    "pydantic==2.13.4",          # requis par pydantic-settings et utilisé directement
    "pydantic-settings==2.15.0",  # ≥2.14.2 corrige GHSA-4xgf-cpjx-pc3j
    "pyahocorasick==2.3.1",      # automate Aho-Corasick : matching multi-formes des adresses (phase affiliations)
    "defusedxml==0.7.1",         # lecture du TEI joint aux notices HAL : refuse les déclarations d'entités, que l'analyseur standard développe
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",                   # CVE-2025-71176 fixed
    "pytest-asyncio==1.4.0",           # tests des extractions HTTP async du pipeline
    "pytest-cov==7.1.0",
    "respx==0.23.1",                   # mocking httpx pour tests async
    "ruff==0.16.4",
    "mypy==2.3.1",
    "deptry==0.25.1",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "pre-commit-hooks==6.0.0",         # check-yaml/toml/… lancés en local via `python -m`
    "import-linter==2.13",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["application*", "domain*", "infrastructure*", "interfaces*"]

# ----------------------------------------------------------------------
# deptry : détection de dépendances manquantes / inutiles / transitives
# Lit [project.dependencies] (PEP 621) et [project.optional-dependencies.dev].
# ----------------------------------------------------------------------
[tool.deptry]
known_first_party = ["application", "domain", "infrastructure", "interfaces"]
extend_exclude = ["frontend", ".venv", "venv"]
# Le groupe `dev` de [project.optional-dependencies] est pour les outils
# de dev/test — deptry ne doit pas exiger qu'ils soient importés.
optional_dependencies_dev_groups = ["dev"]

# ----------------------------------------------------------------------
# import-linter : vérifie les règles de dépendance entre couches DDD.
# Lancement : `lint-imports`
# ----------------------------------------------------------------------
[tool.importlinter]
root_packages = ["domain", "application", "infrastructure", "interfaces"]
# Nécessaire pour les contrats `forbidden` qui ciblent des modules
# externes (cf. "Domain : pas de framework externe").
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Couches DDD (layered)"
type = "layers"
layers = ["interfaces", "infrastructure | application", "domain"]
# `application` n'importe pas `infrastructure` : toute nouvelle
# dépendance doit passer par un port.
#
# Exception : `application.ports.*` est zone neutre (cf. règle 2 de
# docs/architecture/01-vue-d-ensemble.md). `infrastructure` peut en
# importer les dataclasses de transport pour typer ses signatures
# (cf. règle 3). Les Protocols restent implémentés via duck typing.
#
ignore_imports = [
    "infrastructure.** -> application.ports.**",
]

[[tool.importlinter.contracts]]
name = "Routers : pas d'import direct de infrastructure"
type = "forbidden"
source_modules = ["interfaces.api.routers"]
forbidden_modules = ["infrastructure"]
# Les routers FastAPI pilotent des use-cases applicatifs et reçoivent
# leurs dépendances via `Depends(...)` (factories dans
# `interfaces.api.deps`, composition root). La construction des
# adapters et l'accès direct à l'infra (queries, repos, pool, engine)
# y sont interdits. Cf. règle 4 de docs/architecture/01-vue-d-ensemble.md.
#
# Imports transitifs autorisés : `routers → deps → infrastructure` est
# le chemin attendu (composition root), donc on n'interdit que les
# imports directs.
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Composition root : Pg* concrets uniquement dans app et deps"
type = "forbidden"
source_modules = ["interfaces.api"]
forbidden_modules = [
    "infrastructure.repositories",
    "infrastructure.read_models",
    "infrastructure.pipeline",
]
# Verrouillage de la règle 5 de docs/architecture/01-vue-d-ensemble.md :
# seul `interfaces/api/deps.py` instancie les `Pg*` concrets ; les
# routers et autres modules sous `interfaces.api/` passent par un port
# via `Depends(...)`.
ignore_imports = [
    "interfaces.api.deps -> infrastructure.repositories.**",
    "interfaces.api.deps -> infrastructure.read_models.**",
    "interfaces.api.deps -> infrastructure.pipeline.**",
]

[[tool.importlinter.contracts]]
name = "API : aucune requête réseau sortante"
type = "forbidden"
source_modules = ["interfaces.api"]
forbidden_modules = ["httpx", "socket"]
# Le dossier de sécurité remis au RSSI énonce que l'API n'émet aucun appel sortant : elle lit
# et écrit dans PostgreSQL, et rien d'autre. Tout le trafic sortant appartient au pipeline,
# exécuté hors du cycle web. Ce contrat en fait une garantie mécanique plutôt qu'un constat :
# aucun module servant une requête HTTP ne peut atteindre un client réseau, fût-ce par un
# import indirect (les chaînes sont vérifiées, pas seulement les imports directs).
#
# `httpx` est le client HTTP unique du projet, et `socket` ferme la porte à un repli sur la
# bibliothèque standard. `urllib.request` mériterait d'y figurer, mais l'outil ne sait pas
# viser le sous-module d'un paquet externe, et interdire `urllib` entier écarterait aussi
# `urllib.parse`, dont le domaine se sert pour manipuler des URL sans rien émettre.

[[tool.importlinter.contracts]]
name = "Domain : pas de framework externe"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["pydantic", "sqlalchemy", "fastapi", "starlette", "psycopg"]
# Le domaine ne dépend de rien : pas d'ORM, pas de validation
# Pydantic, pas de framework web, pas de driver DB. Les modèles
# d'I/O JSONB (BaseModel) vivent dans infrastructure/jsonb_models/.

[tool.deptry.per_rule_ignores]
# Paquets que rien n'importe, et qui restent des dépendances de production.
# - python-dotenv : pydantic-settings l'appelle en interne dès qu'on utilise
#   `env_file=...`.
# - uvicorn : serveur ASGI lancé en ligne de commande (`CMD uvicorn ...` du
#   Dockerfile, `start.sh`, systemd ou pm2 hors Docker). C'est lui qui importe
#   l'application, jamais l'inverse — deptry ne lit que les imports.
DEP002 = ["python-dotenv", "uvicorn"]

# Alias paquet distribué → nom de module importé (les noms peuvent différer).
[tool.deptry.package_module_name_map]
pydantic-settings = "pydantic_settings"
pyahocorasick = "ahocorasick"

# ----------------------------------------------------------------------
# Ruff : linter + formateur (remplace flake8, isort, pyupgrade, black)
# Mode permissif au début — voir `ruff check .` et `ruff format --check .`
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    # Les extraits de code de la documentation illustrent un propos : ils ne sont pas du code
    # à maintenir, et les fiches archivées sont un compte rendu qu'on ne réécrit pas.
    "*.md",
    ".claude",  # hooks du harnais de développement, hors code applicatif
    "interfaces/frontend",
    "bibliometrie_uca.egg-info",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Règles activées — on démarre permissif, à durcir au fil du temps.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (undefined names, unused imports, etc.)
    "I",      # isort (ordre des imports)
    "UP",     # pyupgrade (syntaxe obsolète)
    "B",      # flake8-bugbear (pièges courants)
    "C901",   # complexité cyclomatique
    "ASYNC",  # flake8-async : I/O bloquantes dans une async def, etc.
    "S",      # flake8-bandit : 73 règles de sécurité (cf. per-file-ignores pour les exceptions)
    "A",      # flake8-builtins : un nom qui masque une fonction de base
    "C4",     # flake8-comprehensions : compréhensions et appels de collection superflus
    "DTZ",    # flake8-datetimez : instants sans fuseau (cf. `domain.dates.today`)
    "G",      # flake8-logging-format : message de journalisation formaté à l'émission
    "ISC",    # flake8-implicit-str-concat : concaténation implicite de littéraux
    "LOG",    # flake8-logging : usage du module de journalisation
    "PERF",   # Perflint : boucles réécrivables en compréhension
    "PIE",    # flake8-pie : tournures inutiles
    "Q",      # flake8-quotes : cohérence des guillemets
    "RET",    # flake8-return : chemins de retour superflus
    "TID",    # flake8-tidy-imports : imports relatifs remontants
]
# RUF029 (async def sans await) serait utile mais reste en preview chez
# ruff à ce jour : l'activer exigerait `preview = true` qui allume
# d'autres règles preview non évaluées. À ajouter quand elle stabilise.
# Ignorés le temps d'assainir progressivement
ignore = [
    "E501", # ligne trop longue — à durcir plus tard
    "E402", # module-level import not at top — quelques cas légitimes
    "B008", # function call in default argument — FastAPI Depends() idiomatique
]

[tool.ruff.lint.mccabe]
# Seuil à 15 après décomposition de publications_facets (25 → <10),
# _build_list_conditions (17 → <15), refresh_from_sources (24 → <15),
# export_publications_csv (23 → <15). Prochaine cible : 10.
max-complexity = 15

[tool.ruff.lint.isort]
# Regroupe les imports d'un même module en un seul bloc, alias inclus
# (sinon chaque `from x import (a as b)` aliasé occupe son propre bloc).
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# `S101` : une assertion est le propos d'un test. `S105`/`S106` : les fixtures posent des
# identifiants factices, nommés pour ce qu'ils sont. `S608` : les tests composent du SQL de
# jeu de données.
"tests/*" = ["E402", "S101", "S105", "S106", "S108", "S324", "S608"]
# `S608` signale toute interpolation dans une chaîne SQL. Ces couches ont pour métier de
# composer des requêtes à partir de fragments pris dans des listes blanches écrites en dur
# (tris, dimensions, colonnes) ; les valeurs issues d'une requête HTTP, elles, passent
# toujours par des paramètres liés. La règle reste active partout ailleurs — un SQL composé
# à la main dans `interfaces/api` ou `application` doit se signaler.
"infrastructure/read_models/*" = ["S608"]
"infrastructure/pipeline/*" = ["S608"]
"infrastructure/repositories/*" = ["S608"]
"alembic/versions/*" = ["S608"]
"run_pipeline.py" = ["S608"]
# Scripts de développement : `dump_schema` lance `pg_dump`, dont il compose lui-même les
# arguments.
"interfaces/cli/dev/*" = ["S603", "S607"]
# Génération d'illustrations : la disposition d'un graphe tire au sort des positions.
"docs/img/graphs/*" = ["S311"]
# `S101` vise l'assertion qui porte une décision de sécurité, effacée par l'interpréteur en
# mode optimisé. Ces couches s'en servent pour des invariants internes — cohérence d'un
# registre au chargement, resserrement d'un type — sans qu'aucune autorisation en dépende.
# La règle reste active sur `interfaces/` et `application/services/`, où une décision
# d'autorisation pourrait naître.
"domain/*" = ["S101"]
"infrastructure/*" = ["S101"]
"application/pipeline/normalize/normalize_hal.py" = ["S101"]
"interfaces/cli/*" = ["E402", "S608"] # scripts one-shot
"application/pipeline/*" = ["S101"]
"interfaces/api/routers/*" = ["E402"] # imports tardifs fréquents

# ----------------------------------------------------------------------
# Pytest + coverage
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Mode d'import `importlib` : le nom de module dérive du chemin complet,
# ce qui autorise des fichiers de test homonymes dans des répertoires
# distincts sans exiger un `__init__.py` dans chacun.
addopts = "-q --import-mode=importlib"
# pytest-asyncio mode auto — les fonctions `async def test_*` sont
# reconnues automatiquement sans décorateur. Loop scope par fonction
# (défaut) : chaque test async a sa propre boucle.
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["application", "domain", "infrastructure", "interfaces"]
omit = [
    "tests/*",
    "*/__init__.py",
    # Scripts CLI one-shot : lancés à la main, pas testés unitairement.
    # Leur logique métier utile est factorisée dans application/ ou
    # infrastructure/ et testée là.
    "interfaces/cli/*",
    # Debug scripts dans interfaces/cli/debug/
    "interfaces/cli/debug/*",
    # Wiring HTTP des adapters sources : pure functions de parsing
    # extraites dans `domain/sources/<source>_extract.py` (couvert par
    # tests unit) ; ce qui reste = httpx + pagination + sleep + impl
    # du port `<Source>ExtractAdapter`. Faible ROI sur tests fixtures.
    "infrastructure/sources/hal/extract_hal.py",
    "infrastructure/sources/hal/fetch_missing_hal_id.py",
    "infrastructure/sources/hal/fetch_missing_doi.py",
    "infrastructure/sources/openalex/extract_openalex.py",
    "infrastructure/sources/openalex/fetch_missing_doi.py",
    "infrastructure/sources/openalex/refetch_truncated.py",
    "infrastructure/sources/scanr/extract_scanr.py",
    "infrastructure/sources/scanr/fetch_missing_doi.py",
    "infrastructure/sources/theses/extract_theses.py",
    "infrastructure/sources/wos/extract_wos.py",
    "infrastructure/sources/wos/fetch_missing_doi.py",
    "infrastructure/sources/crossref/fetch_missing_doi.py",
    # Refetch des documents stale par source : même nature d'adapter HTTP
    # (httpx + pagination + impl du port refresh_stale) que l'extraction
    # ci-dessus ; la logique utile de sélection vit côté queries/domain.
    "infrastructure/sources/refresh_stale_base.py",
    "infrastructure/sources/*/refresh_stale.py",
    # Orchestrateurs CLI du pipeline d'extraction : wiring async
    # (httpx + Semaphore + Lock) + branches mode/dry_run/stats_only.
    # Même logique d'exclusion que les adapters HTTP ci-dessus.
    "application/pipeline/extract/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
# Seuil progressif : ne jamais régresser. À faire remonter au fur et à
# mesure qu'on ajoute des tests.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ----------------------------------------------------------------------
# Mypy : type checker (mode permissif au démarrage)
# Durcir module par module via overrides quand le code est stabilisé.
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# Imports : ignorer les libs tierces non typées plutôt que de polluer
ignore_missing_imports = true
# Mode strict : toutes les fonctions doivent être annotées, et leur corps
# est vérifié.
check_untyped_defs = true
disallow_untyped_defs = true
# `Any` explicite interdit globalement. Exceptions explicites via
# overrides ci-dessous, toutes documentées (frontières JSON/JSONB en
# lecture, records DB hydratés, helpers polymorphiques, partial updates DB).
disallow_any_explicit = true
disallow_any_generics = true
# `-> Any` propagé toléré pragmatiquement.
warn_return_any = false
# Afficher les codes d'erreur pour pouvoir ignorer précisément au besoin
show_error_codes = true
# Ne pas imposer l'absence d'Optional implicite
implicit_optional = true
# Ignorer les erreurs dans les tests (focus sur le code de prod)
exclude = [
    "^tests/",
    "^frontend/",
    "^bibliometrie_uca\\.egg-info/",
    "^\\.venv/",
    "^build/",
    # Code Alembic : `op` et `context` sont ajoutés dynamiquement au
    # module `alembic` à l'import, mypy ne les détecte pas. Cohérent
    # avec l'exclusion `tests/` : code framework, pas du métier.
    "^alembic/",
]

# Désactivation explicite pour les modules dont les `Any` sont
# délibérés. Documentés au cas par cas :
# - `domain.sources.*`, `infrastructure.sources.*`, `infrastructure.jsonb_models.*` :
#   payloads JSON bruts d'APIs externes / colonnes JSONB libres.
# - `application.ports.read_models.*` : DTOs Pydantic co-localisés — `BaseModel`
#   propage `Any` via ses stubs (`__init__: **data: Any`), ce qui déclenche
#   `explicit-any` à chaque héritage `class X(BaseModel)`. Le `Any` côté
#   projet reste par ailleurs strict ; l'override ne couvre que la surface
#   Pydantic. Idem pour `infrastructure.settings` qui hérite de `BaseSettings`.
# - `application.ports.repositories.*` (sauf audit + les projections déjà
#   typées des ports structures/persons) : records DB hydratés et partial
#   updates encore exposés en `dict[str, Any]`.
# - `application.ports.pipeline.{staging,subjects}` : `raw_data: dict[str, Any]`
#   JSONB sur `StagingRow`, `list[Any]` sur
#   `select_source_publications_with_subjects`.
# - `domain.publications.aggregation` : `first_non_null` /
#   `merge_lists_dedup_ci` polymorphiques sur `getattr(source, attr)`.
# - `application.pipeline.normalize.*` (hors port `normalize.wos`, déjà strict) :
#   consomment des payloads `dict[str, Any]` venant des APIs externes (cf.
#   `domain.sources.*`).
# - `application.pipeline.subjects._common` : `_PushedOntology` interne au
#   cache (dict mutable avec sets, difficile à typer).
# - `infrastructure.repositories.*`, `infrastructure.read_models.*` et
#   `infrastructure.pipeline.*` : couche SQL — Row, records DB, batchs hétérogènes.
# - `interfaces.cli.{imports,maintenance,oneshot}.*` : scripts touchant des
#   records DB / payloads JSONB — `Any` délibéré, comme les couches SQL. Ils
#   restent annotés et leurs corps vérifiés (≠ exclusion : cf. `exclude` plus haut).
# - `interfaces.api.models.*` : nombreux fields `Any` (payloads JSONB libres
#   côté API, body dicts hétérogènes), tant que `JsonValue` ne couvre pas
#   tous les cas.
# - `interfaces.cli.dev.generate_seed.TABLES` : schéma de seed,
#   `list[dict[str, Any]]` délibéré.
# - `run_pipeline` : entry-point CLI qui orchestre des subprocess + dict
#   d'options hétérogènes (`Any` délibéré).
[[tool.mypy.overrides]]
module = [
    "application.pipeline.cross_imports.*",
    "application.pipeline.extract.*",
    "application.pipeline.logging_scope",
    "application.pipeline.normalize.*",
    "application.pipeline.oa_status.*",
    "application.pipeline.publishers_journals.*",
    "application.pipeline.subjects._common",
    "application.ports.read_models.*",
    "application.ports.pipeline.cross_imports.*",
    "application.ports.pipeline.extract.*",
    "application.ports.pipeline.journals",
    "application.ports.pipeline.normalize.staging",
    "application.ports.pipeline.subjects",
    "application.ports.repositories.*",
    "domain.publications.aggregation",
    "domain.sources.*",
    "infrastructure.jsonb_models.*",
    "infrastructure.pipeline.*",
    "infrastructure.read_models.*",
    "infrastructure.repositories.*",
    "infrastructure.settings",
    "infrastructure.sources.*",
    "interfaces.api.app",
    "interfaces.api.models.*",
    "interfaces.cli.dev.generate_seed",
    "interfaces.cli.imports.*",
    "interfaces.cli.maintenance.*",
    "interfaces.cli.oneshot.*",
    "run_pipeline",
]
disallow_any_explicit = false
disallow_any_generics = false
