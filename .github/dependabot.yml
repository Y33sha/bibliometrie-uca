# Mises à jour automatisées des dépendances (pull requests hebdomadaires).
# Complète les scans bloquants pip-audit / npm audit : la détection reste au push,
# la remédiation arrive en PR à réviser. Les mises à jour mineures et correctives
# sont groupées par écosystème pour limiter le nombre de PR ; les majeures, plus
# risquées, ouvrent une PR chacune.
version: 2
updates:
  # ---- Backend Python (pyproject.toml + uv.lock à la racine) ----
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-mineures:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- Frontend SvelteKit (package.json + package-lock.json) ----
  - package-ecosystem: "npm"
    directory: "/interfaces/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-mineures:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- Actions GitHub épinglées dans les workflows CI ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  # ---- Images de base des descriptions de construction ----
  # Ces images sont désignées par leur empreinte : une empreinte se fige, et sans suivi elle
  # vieillit sur place. La fraîcheur des paquets système, elle, tient à la mise à jour que la
  # construction applique.
  #
  # L'écosystème `docker` ne lit qu'un répertoire à la fois, d'où une entrée par emplacement :
  # la description de production à la racine, celles du développement dans les deux interfaces.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/interfaces/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/interfaces/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"

  # Les descriptions de composition portent l'image de la base, que l'écosystème `docker`
  # ci-dessus ne lit pas : il ne parcourt que les descriptions de construction.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
