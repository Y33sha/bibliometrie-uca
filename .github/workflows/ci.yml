name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Le jeton fourni aux jobs ne lit que le contenu du dépôt. Sans cette déclaration, il porte
# les droits par défaut de l'organisation, qui peuvent inclure l'écriture : une action tierce
# compromise s'en servirait pour pousser du code ou publier une release.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: postgres
      DB_OWNER_USER: postgres
      DB_OWNER_PASSWORD: postgres
      # Identité restreinte sous laquelle les tests d'API se connectent, comme l'application
      # en production. Le rôle est créé sur la base de test s'il n'existe pas.
      DB_APP_USER: bibliometrie_app
      DB_APP_PASSWORD: bibliometrie_app_ci
      # Valeurs bidon : les tests n'exercent pas l'authentification, mais l'API refuse de
      # démarrer sans empreinte de mot de passe ni clé de signature d'au moins 32 caractères,
      # et les tests d'intégration déclenchent son cycle de vie.
      ADMIN_HASH: ci-placeholder-not-used
      SESSION_SECRET: ci-placeholder-session-secret-of-sufficient-length

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Upgrade pip + setuptools (les versions bootstrap du venv ont
          # des CVE documentées ; pip-audit les signalerait sinon).
          pip install --upgrade pip setuptools
          pip install ".[dev]"

      - name: Dependency hygiene (deptry)
        run: deptry .

      - name: Vulnerability scan (pip-audit)
        run: pip-audit

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Architecture contracts (import-linter)
        run: lint-imports

      - name: Type check (mypy)
        run: mypy .

      - name: Unit tests (garde rapide, sans BDD)
        run: python -m pytest tests/unit/ -v

      - name: Coverage (tous les tests, seuil via pyproject.toml)
        # Re-joue toute la suite (unitaires + intégration) sous instrumentation : couvre le pass/fail
        # ET le seuil de couverture. L'étape unitaire ci-dessus n'est qu'un fail-fast (~2 s) avant
        # cette passe complète ; pas d'étape intégration séparée, qui ne ferait que la rejouer.
        run: python -m pytest tests/ --cov --cov-report=term-missing

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: interfaces/frontend
        run: npm ci

      # `--omit=dev` : seul `dependencies` part dans le bundle servi au
      # navigateur. Les vulnérabilités de l'outillage (serveur de dev vite,
      # ws) ne concernent pas l'application déployée et bloqueraient la CI
      # pour un risque qu'elle ne court pas.
      #
      # Seuil `moderate` et non `high` : le score CVSS mesure la gravité dans
      # l'absolu, pas dans notre contexte. Ce qui menace du code de navigateur,
      # ce sont les XSS et les pollutions de prototype, qu'il classe justement
      # sous la barre du `high` — elles supposent une entrée hostile et un
      # utilisateur qui charge la page, et leur portée s'arrête à sa session.
      - name: Vulnerability scan (npm audit)
        working-directory: interfaces/frontend
        run: npm audit --omit=dev --audit-level=moderate

      # L'outillage de construction ne part pas dans le navigateur, mais c'est lui qui produit
      # le bundle servi : une de ses dépendances compromise atteint l'application par la
      # chaîne d'approvisionnement. Le signalement n'arrête pas l'intégration — l'outillage
      # traîne des avis que ses auteurs ne corrigent pas toujours — mais il se voit.
      - name: Vulnerability scan (arbre de construction, non bloquant)
        working-directory: interfaces/frontend
        run: npm audit --audit-level=moderate || true

      - name: Type check
        working-directory: interfaces/frontend
        run: npm run check

      # `svelte/no-at-html-tags` : un `{@html}` ajouté hors des points d'insertion recensés fait
      # échouer l'intégration. C'est le seul endroit du frontend où une valeur reçue d'une source
      # peut devenir du code exécutable ; la liste des dérogations vit dans `eslint.config.js`.
      - name: Lint (eslint)
        working-directory: interfaces/frontend
        run: npm run lint

      - name: Tests
        working-directory: interfaces/frontend
        run: npm test

      - name: Build
        working-directory: interfaces/frontend
        run: npm run build

  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Construire l'image vérifie aussi que le `Dockerfile` tient : rien d'autre ne le fait.
      - name: Build production image
        run: docker build -t bibliometrie-uca:ci .

      # `pip-audit` et `npm audit` couvrent les dépendances applicatives, jamais la couche
      # système de l'image. `--ignore-unfixed` réserve l'échec aux failles pour lesquelles un
      # correctif existe : la mise à jour des paquets que la construction applique les ferme.
      - name: Vulnerability scan (image de production)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bibliometrie-uca:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Les failles sans correctif restent listées dans le journal, sans bloquer :
      # elles décrivent l'exposition que l'image transporte jusqu'à parution d'un correctif.
      - name: Failles d'image sans correctif (signalement)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bibliometrie-uca:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
