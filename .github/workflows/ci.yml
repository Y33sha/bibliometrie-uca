name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Passage quotidien : une faille publiée contre une dépendance en service se voit le lendemain.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Jeton en lecture seule : une action tierce compromise ne peut ni pousser du code ni publier une release.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: postgres
      DB_OWNER_USER: postgres
      DB_OWNER_PASSWORD: postgres
      # Rôles PostgreSQL de l'API (tests d'API) et du pipeline (fixtures), comme en production. Créés sur la base de test s'ils manquent.
      DB_APP_USER: bibliometrie_app
      DB_APP_PASSWORD: bibliometrie_app_ci
      DB_PIPELINE_USER: bibliometrie_pipeline
      DB_PIPELINE_PASSWORD: bibliometrie_pipeline_ci
      # Valeurs factices : l'API refuse de démarrer sans elles, et les tests d'intégration déclenchent son cycle de vie.
      ADMIN_HASH: ci-placeholder-not-used
      SESSION_SECRET: ci-placeholder-session-secret-of-sufficient-length

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Versions d'interpréteur lues dans les images de base.
      - id: versions
        uses: ./.github/actions/versions-de-langage

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}

      # `--locked` : versions de `uv.lock`, celles du Dockerfile ; échoue si `uv.lock` ne suit plus `pyproject.toml`.
      - name: Install dependencies
        run: |
          pip install --no-cache-dir uv
          uv sync --locked

      - name: Dependency hygiene (deptry)
        run: uv run deptry .

      - name: Vulnerability scan (pip-audit)
        run: uv run pip-audit --skip-editable

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Architecture contracts (import-linter)
        run: uv run lint-imports

      - name: Type check (pyrefly)
        run: uv run pyrefly check

      - name: Tests et couverture (seuil via pyproject.toml)
        run: uv run python -m pytest tests/ --cov --cov-report=term-missing

      - name: Couverture intégrale de la surface sensible
        # Modules dont un défaut ouvre un accès : contrôle d'accès, bornes d'entrée, lecture seule, audit. Relevé de l'étape précédente.
        run: >
          uv run python -m coverage report --fail-under=100
          --include="interfaces/api/app.py,interfaces/api/session.py,interfaces/api/rate_limit.py,interfaces/api/deps.py,interfaces/api/params.py,interfaces/api/filters.py,interfaces/api/route_path.py,interfaces/api/spa.py,interfaces/api/routers/auth.py,infrastructure/db/read_only_guard.py,infrastructure/db/dml_guard.py,application/audit_log.py"

  # Dependabot monte les images de base sans toucher `.python-version` ni `interfaces/frontend/.nvmrc` : ce job signale l'écart.
  versions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: versions
        uses: ./.github/actions/versions-de-langage

      # Le script confronte aussi le Node installé à la version lue.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Versions de langage alignées sur les images
        run: ./scripts/verifier-les-versions.sh

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: versions
        uses: ./.github/actions/versions-de-langage

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Install dependencies
        working-directory: interfaces/frontend
        run: npm ci

      # `--omit=dev` : seul `dependencies` part dans le bundle servi au navigateur. Seuil `moderate` : CVSS y classe les XSS et les pollutions de prototype, menaces propres au code de navigateur.
      - name: Vulnerability scan (npm audit)
        working-directory: interfaces/frontend
        run: npm audit --omit=dev --audit-level=moderate

      # L'outillage de construction produit le bundle : ses failles sont signalées sans bloquer, ses auteurs ne les corrigeant pas toujours.
      - name: Vulnerability scan (arbre de construction, non bloquant)
        working-directory: interfaces/frontend
        run: npm audit --audit-level=moderate || true

      - name: Type check
        working-directory: interfaces/frontend
        run: npm run check

      # `svelte/no-at-html-tags` : un `{@html}` hors des dérogations de `eslint.config.js` fait échouer l'intégration.
      - name: Lint (eslint)
        working-directory: interfaces/frontend
        run: npm run lint

      - name: Tests
        working-directory: interfaces/frontend
        run: npm test

      - name: Build
        working-directory: interfaces/frontend
        run: npm run build

      # `schema.ts` suit le contrat OpenAPI de l'API.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}

      - name: schema.ts suit le contrat OpenAPI
        run: |
          pip install --no-cache-dir uv
          uv sync --locked --no-dev
          uv run python -m interfaces.cli.dev.dump_openapi /tmp/openapi.json
          ( cd interfaces/frontend && npx openapi-typescript /tmp/openapi.json -o /tmp/schema.ts )
          diff -q interfaces/frontend/src/lib/api/schema.ts /tmp/schema.ts \
            || { echo "schema.ts a dérivé de l'OpenAPI : lancer npm run types:gen puis commiter"; exit 1; }

  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Défauts de configuration des descriptions de construction et de déploiement, et secrets écrits dans le dépôt. Exceptions dans `.trivyignore.yaml`.
      - name: Configuration et secrets (dépôt)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          skip-dirs: node_modules,.venv,.git

      # Seul contrôle de la construction du Dockerfile.
      - name: Build production image
        run: docker build -t bibliometrie-uca:ci .

      # Couche système de l'image. `ignore-unfixed` : échec seulement sur une faille corrigée en amont, que la mise à jour des paquets ferme à la construction suivante.
      - name: Vulnerability scan (image de production)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bibliometrie-uca:ci
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Failles sans correctif : listées au journal, sans bloquer.
      - name: Failles d'image sans correctif (signalement)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bibliometrie-uca:ci
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "0"
