name: Documentation

# Construit le site de la documentation (zensical) et le publie sur GitHub Pages, à chaque envoi sur
# master qui touche la documentation ou le code dont elle tire la référence (`domain/`).
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "domain/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Une seule publication à la fois ; celle qui est en cours va à son terme.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: versions
        uses: ./.github/actions/versions-de-langage

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}

      - name: Install dependencies
        run: |
          pip install --no-cache-dir uv
          uv sync --locked

      - name: Build
        run: uv run zensical build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Seul ce job écrit : il publie l'archive du site sur GitHub Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
