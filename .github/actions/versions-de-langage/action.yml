name: Versions de langage
description: >-
  Lit dans la description de construction de production les versions de Python, de Node et de uv, pour que l'intégration continue installe celles que l'image livre. Le `Dockerfile` les écrit en clair, l'épinglage par empreinte l'exigeant ; elles ne sont écrites nulle part ailleurs.

outputs:
  python:
    description: Version de Python de l'image finale.
    value: ${{ steps.lire.outputs.python }}
  node:
    description: Version de Node de l'étape de construction du frontend.
    value: ${{ steps.lire.outputs.node }}
  uv:
    description: Version de uv de l'étape qui installe les dépendances Python.
    value: ${{ steps.lire.outputs.uv }}

runs:
  using: composite
  steps:
    - id: lire
      shell: bash
      run: ./scripts/versions-des-images.sh >> "$GITHUB_OUTPUT"
